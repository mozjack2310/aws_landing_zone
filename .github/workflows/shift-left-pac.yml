name: "Shift-Left Policy-as-Code & IaC Gate"

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  static-pac-gate:
    name: "Terraform Validate & Checkov Security Gate"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"

      - name: Canonical Format Check (terraform fmt)
        run: terraform fmt -check -recursive

      - name: Validate All 4 Architectural Layers (Zero Cloud Credentials Needed)
        run: |
          for layer in bootstrap governance network-hub spoke-vending; do
            echo "==> Validating layer: $layer"
            terraform -chdir="$layer" init -backend=false
            terraform -chdir="$layer" validate
          done

      - name: Execute Checkov Shift-Left Security & FinOps Gate
        uses: bridgecrewio/checkov-action@3f0caf0c3aa9f56ade6b49f6e60b63aaeafb75a3 # v12
        with:
          directory: spoke-vending
          external_checks_dirs: governance/policies
          framework: terraform
          quiet: true
          compact: true
          soft_fail: false

      - name: Execute Checkov Container Security Gate (edge-broker/Dockerfile)
        uses: bridgecrewio/checkov-action@3f0caf0c3aa9f56ade6b49f6e60b63aaeafb75a3 # v12
        with:
          file: edge-broker/Dockerfile
          framework: dockerfile
          quiet: true
          compact: true
          soft_fail: false
