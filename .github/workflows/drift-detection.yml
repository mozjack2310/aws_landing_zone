name: "Automated Platform Drift Detection"

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  id-token: write
  contents: read

jobs:
  detect-drift:
    name: "Audit State vs Live Cloud (${{ matrix.layer }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        layer: [bootstrap, governance, network-hub, spoke-vending]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Authenticate via AWS OIDC (Zero Static Keys)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsLandingZoneRole
          aws-region: us-east-1

      - name: Terraform Init (${{ matrix.layer }})
        run: terraform -chdir="${{ matrix.layer }}" init -input=false -backend-config="bucket=corp-platform-tfstate-${{ secrets.AWS_ACCOUNT_ID }}-us-east-1"

      - name: Execute Drift Check (detailed-exitcode)
        env:
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
          TF_VAR_allowed_edge_wan_cidrs: ${{ secrets.ALLOWED_EDGE_WAN_CIDRS }}
        run: |
          set +e
          terraform -chdir="${{ matrix.layer }}" plan -detailed-exitcode -no-color -input=false
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "PASS: Layer ${{ matrix.layer }} is IN_SYNC (Zero Drift)."
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "CRITICAL DRIFT DETECTED in layer: ${{ matrix.layer }}"
            exit 2
          else
            echo "ERROR running terraform plan in layer: ${{ matrix.layer }}"
            exit 1
          fi
